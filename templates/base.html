<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeno Farm | Smart Agriculture</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}?v={{ range(1, 9999) | random }}">
</head>
<body>
    <header>
        <a href="/" class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right: 8px;"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.52-4.48 10-10 10Z"/><path d="M7 21c-4.35-1.47-6-4-6-7 0-1.5 1-3.5 3-3.5s1.5 1 1.5 2.5c0 2-1.5 3.5-3 5"/><path d="M2 10l7 10"/></svg>
            Greeno Farm
        </a>
        <nav>
            <a href="/">Home</a>
            <a href="/yield">Yield Predictor</a>
            <a href="/nutrient">Nutrient Analyzer</a>
            <a href="/deficiency">Deficiency Detector</a>
            <button class="nav-cta">Get Started</button>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer style="padding: 60px 40px; text-align: center; border-top: 1px solid #eee; background: #fff; color: #0A2B16; font-weight: 600;">
        <div style="margin-bottom: 20px;">GREENO FARM</div>
        <p style="opacity: 0.6; font-size: 0.9rem;">&copy; 2025 SmartFarm AI &bull; Sustainable Intelligence</p>
    </footer>
</body>
</html>
