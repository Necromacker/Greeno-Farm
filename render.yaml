services:
  - type: web
    name: smartfarm-ai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Set this in the Render Dashboard
      - key: PYTHON_VERSION
        value: 3.10.12
